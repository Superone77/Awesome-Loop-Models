name: Build generated repo artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python3 - << 'EOF'
          """Validate catalog source YAML files without writing generated artifacts."""

          from scripts import build

          papers = build.load_papers()
          blogs = build.load_blogs()
          print(f"Validated {len(papers)} paper YAML files and {len(blogs)} blog YAML files")
          EOF

      - name: Build papers.json, briefing-latest.json, submission-meta.json, README.md, and TAGS.md
        run: python3 scripts/build.py

      - name: Check static asset budgets
        run: python3 scripts/check_asset_budgets.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -p 'test_*.py'
