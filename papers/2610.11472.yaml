desc: LLoCoT replaces autoregressive latent chain-of-thought with weight-tied looped refinement
  of 64 latent workspace slots by a Qwen3-1.7B backbone, sampling all latent thoughts in parallel
  before decoding the answer; it slightly beats reasoning SFT on EvalPlus code benchmarks
  with about 36x lower time to first answer token.
