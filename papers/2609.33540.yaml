desc: Introduces Geometric Fixed-Point Reasoning, which iterates a weight-tied map
  on a product of simplices so the recurrent state is itself the categorical prediction
  and a fixed point exists for any parameters; a 7M-parameter model reaches 95.1 percent
  on Sudoku-Extreme and 92.0 percent on Maze-Hard, and a 201M language model with
  24 Picard steps beats GPT-2 small on four zero-shot tasks.
