desc: Introduces Input-Conditioned Search, which scales frozen Tiny Recursive Models at test
  time by rerunning them under hypothesis-injected or restated inputs, shows that input
  changes can remove incorrect attracting fixed points, and raises Sudoku-Extreme accuracy
  from 87.85 to 99.81 percent.
