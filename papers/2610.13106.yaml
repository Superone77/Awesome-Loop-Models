desc: Eco-RNA is an 80M-parameter RNA foundation model whose input-conditioned shared Transformer
  core is iterated a chosen number of times, trained with sampled depths and a fixed-point
  displacement penalty; RNAGym fitness Spearman rises from 0.242 at one iteration to 0.286
  at four, beating Evo 2 40B with 500x fewer parameters.
