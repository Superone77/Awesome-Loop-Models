desc: Predicts from the expected head output under the invariant measure of a recurrent
  block's latent dynamics, approximated by a running average over iterations, instead
  of from one latent state, so predictions stay stable even when states never reach
  a fixed point; trained from scratch it lifts EqR on Maze-Unique 30x30 from 89.4
  to 98.8 percent.
