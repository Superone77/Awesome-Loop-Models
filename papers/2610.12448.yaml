desc: reViT applies one Transformer block at every depth of a vision encoder and gives each
  depth its own FFN by merging a small shared expert bank in weight space with a router conditioned
  only on normalized depth; reViT-B/16 matches DeiT III on ImageNet-1k with about 70 percent
  fewer stored parameters at similar FLOPs.
