desc: Shows that jailbreak success on Ouro looped language models can rise with recurrent
  depth and that attacks transfer across depths, then proposes SafeBridge (depth-specific
  modulation of the shared layers, a gated bridge to a safer earlier depth, and cross-depth
  safety objectives), cutting Ouro-2.6B attack success from 44.93 percent under DPO to 9.85
  percent.
