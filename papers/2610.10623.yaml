desc: LoopOPD post-trains looped language models by using a frozen terminal-loop policy of
  the same weight-tied model as an on-policy teacher for an intermediate loop, and D-LoopOPD
  refreshes that shared-parameter teacher every step; on Ouro-2.6B-Thinking it lifts the AIME
  2024-2026 Avg@16 average from 55.49 to 62.36.
